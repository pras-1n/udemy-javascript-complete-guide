<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>オブジェクトの操作</title>
    <link rel="stylesheet" href="styles/app.css" />
    <script src="scripts/objects.js" defer></script>
  </head>
  <body>
    <section id="user-input" class="card">
      <div class="control">
        <label for="title">お気に入りの映画</label>
        <input type="text" id="title" />
      </div>
      <div class="inline-controls">
        <div class="control">
          <label for="extra-name">追加情報（名前）</label>
          <input type="text" id="extra-name" />
        </div>
        <div class="control">
          <label for="extra-value">追加情報（値）</label>
          <input type="text" id="extra-value" />
        </div>
      </div>
      <button id="add-movie-btn">映画を追加</button>
    </section>
    <section class="card" id="filter">
      <label for="filter-title">タイトルで絞り込む</label>
      <input type="text" id="filter-title" />
      <button id="search-btn">検索</button>
    </section>
    <ul id="movie-list" class="card"></ul>
  </body>
</html>
